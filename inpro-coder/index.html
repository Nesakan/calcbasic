<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inpro Coder — CalcBASIC Web IDE for writing, storing, exporting, and running BASIC programs.">
  <title>Inpro Coder — CalcBASIC IDE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="top-header">
      <div class="brand">
        <svg class="brand-hex" viewBox="0 0 36 36" fill="none" aria-hidden="true">
          <polygon points="18,2 32,10 32,26 18,34 4,26 4,10" stroke="currentColor" stroke-width="2.2" fill="rgba(56, 189, 248, 0.12)" />
          <path d="M13 14l-4 4 4 4M23 14l4 4-4 4M19.5 12l-3 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="brand-text">
          <span class="brand-name">Inpro Coder</span>
          <span class="brand-sub">CalcBASIC IDE</span>
        </div>
      </div>

      <div class="user-menu-wrap">
        <button class="user-trigger" id="userTrigger" aria-expanded="false" aria-haspopup="true">
          <span class="user-name" id="userName">User Name</span>
          <span class="user-avatar" aria-hidden="true">U</span>
        </button>
        <div class="user-dropdown" id="userDropdown" hidden>
          <div class="dropdown-meta">Local Workspace <span class="badge-soon">Auth Pending</span></div>
          <button class="dropdown-item danger" id="btnLogout">Logout</button>
        </div>
      </div>
    </header>

    <!-- Body Grid -->
    <div class="app-body">
      <aside class="sidebar" aria-label="Main Navigation">
        <nav class="nav-list">
          <button class="nav-btn active" data-view="programs" id="navPrograms">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <span>PROGRAMS</span>
          </button>
          <button class="nav-btn" data-view="create" id="navCreate">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <span>CREATE</span>
          </button>
          <button class="nav-btn" data-view="run" id="navRun">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span>RUN MODE</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="status-mini">
            <span class="dot-online"></span>
            <span id="sidebarCount">3 Saved</span>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <!-- VIEW 1: PROGRAMS -->
        <section class="view active" id="view-programs">
          <div class="view-header">
            <div>
              <h1>Saved Programs</h1>
              <p class="view-desc">Your programs are stored indefinitely. Click Run to execute any program immediately.</p>
            </div>
            <div class="view-actions">
              <input type="search" id="programSearch" class="text-input" placeholder="Search programs...">
              <label class="btn secondary file-btn">
                Import
                <input type="file" id="fileImportInput" accept=".bas,.txt,.json" hidden>
              </label>
              <button class="btn secondary" id="btnDownloadAll">Export All</button>
              <button class="btn primary" id="btnNewProgram">+ New Program</button>
            </div>
          </div>

          <div class="cards-grid" id="programsGrid"></div>
        </section>

        <!-- VIEW 2: CREATE -->
        <section class="view" id="view-create">
          <div class="create-toolbar">
            <div class="toolbar-left">
              <label class="field-inline">
                <span>Program Name</span>
                <input type="text" id="editorNameInput" class="text-input" placeholder="My Program">
              </label>
            </div>
            <div class="toolbar-right">
              <button class="btn secondary" id="btnEditorClear">Clear</button>
              <button class="btn secondary" id="btnEditorSave">Save</button>
              <button class="btn primary" id="btnEditorSaveRun">Save &amp; Run ▶</button>
            </div>
          </div>

          <div class="snippet-bar">
            <span class="snippet-label">Insert:</span>
            <button class="chip" data-insert=" → ">→</button>
            <button class="chip" data-insert="^">^</button>
            <button class="chip" data-insert=" <> ">&lt;&gt;</button>
            <button class="chip" data-insert='PRINT ""'>PRINT</button>
            <button class="chip" data-insert='INPUT "Value: ", X'>INPUT</button>
            <button class="chip" data-insert="FOR I = 1 TO 5&#10;    PRINT I&#10;NEXT I">FOR...NEXT</button>
            <button class="chip" data-insert="IF X > 0 THEN&#10;    PRINT X&#10;ELSE&#10;    PRINT 0&#10;END IF">IF...ELSE</button>
          </div>

          <div class="editor-container">
            <div class="line-gutter" id="lineGutter" aria-hidden="true">1</div>
            <textarea id="codeEditor" class="code-textarea" spellcheck="false" placeholder="Write CalcBASIC code here...&#10;Example:&#10;PRINT &quot;Hello Inpro Coder!&quot;&#10;INPUT &quot;Enter number: &quot;, N&#10;PRINT SQRT(N)"></textarea>
          </div>
        </section>

        <!-- VIEW 3: RUN MODE -->
        <section class="view" id="view-run">
          <div class="run-toolbar">
            <div class="toolbar-left">
              <label class="field-inline">
                <span>Program</span>
                <select id="runProgramSelect" class="select-input"></select>
              </label>
              <button class="btn primary" id="btnRunStart">RUN ▶</button>
              <button class="btn danger" id="btnRunStop" disabled>STOP ■</button>
              <button class="btn secondary" id="btnRunClear">Clear Console</button>
            </div>
            <div class="toolbar-right">
              <button class="btn secondary" id="btnToggleVars">Variables (0)</button>
            </div>
          </div>

          <div class="run-layout">
            <div class="console-panel">
              <div class="casio-status-strip">
                <span id="runStatusText">READY</span>
                <span id="runStateBadge" class="state-badge idle">IDLE</span>
              </div>

              <div class="console-output" id="consoleOutput" aria-live="polite"></div>

              <form class="console-input-bar" id="consoleInputForm">
                <span class="prompt-chevron" id="inputPromptLabel">&gt;</span>
                <input type="text" id="consoleInput" class="console-input" placeholder='Type INPUT response or quick expression (e.g. PRINT 2+2, SQRT(16))...' autocomplete="off">
                <button type="submit" class="btn primary" id="btnConsoleSubmit">EXE</button>
              </form>
            </div>

            <aside class="vars-panel" id="varsPanel" hidden>
              <div class="vars-header">
                <h2>Variables</h2>
                <button class="icon-close" id="btnCloseVars" aria-label="Close Variables">✕</button>
              </div>
              <div class="vars-list" id="varsList">
                <div class="muted">No variables set yet.</div>
              </div>
            </aside>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
